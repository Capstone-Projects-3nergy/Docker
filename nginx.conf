server {
    listen 80;
    server_name _;

    # 👉 ชี้ root แบบปกติ
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # 👉 SPA Routing ธรรมดา
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot|otf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }
}
