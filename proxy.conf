server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name bscit.sit.kmutt.ac.th _;
    ssl_certificate     /ssl/fullchain.pem;
    ssl_certificate_key /ssl/privkey.pem;
    ssl_dhparam         /ssl/dhparam-2048.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    # ================= API =================
    # ดัก /api/api/... ที่ซ้ำมาจาก Load balancer ก่อน
    location /api/api/ {
        rewrite ^/api/api/(.*)$ /api/$1 last;
    }

    # รับ /api/... ปกติ ส่งไป backend โดยตัด /api/ ออก
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ================= Frontend =================
    # อะไรที่ไม่ใช่ API จะตกมาที่นี่ (รวมถึงหน้าแรก และพวกไฟล์ /assets/...)
    location / {
        proxy_pass http://frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
