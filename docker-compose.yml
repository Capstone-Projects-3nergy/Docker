services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    command: >
      --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-capstone}
      MYSQL_USER: ${MYSQL_USER:-cp25nw2}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CapstoneNW2!}
      TZ: ${TZ:-Asia/Bangkok}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - appnet
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Bangkok}
      SPRING_PROFILES_ACTIVE: container
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-capstone}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Bangkok
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-cp25nw2}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-CapstoneNW2!}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_SHOW_SQL: "false"
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID}
      LINE_LOGIN_CHANNEL_SECRET: ${LINE_LOGIN_CHANNEL_SECRET}
    volumes:
      - ./secrets/firebase-adminsdk.json:/run/secrets/firebase.json:ro
    networks:
      - appnet
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    depends_on:
      backend:
        condition: service_started
    networks:
      - appnet
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy:/etc/nginx/conf.d:ro
      - /home/pimpajee/certificateFiles:/ssl:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:

volumes:
  mysql_data:
